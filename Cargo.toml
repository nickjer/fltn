[package]
name = "fltn"
version = "0.3.0"
authors = ["Jeremy Nicklas <jeremywnicklas@gmail.com>"]
edition = "2024"
description = "Flattens a serialized data structure making it greppable"
license = "MIT"
keywords = ["gron", "json", "yaml"]
homepage = "https://github.com/nickjer/fltn"
repository = "https://github.com/nickjer/fltn"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
colored = "3.1"
csv = "1.2"
indexmap = { version = "2.13", features = ["serde"] }
jsonpath-rust = "1.0"
mime = "0.3"
mime_guess = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "unbounded_depth"] }
serde_stacker = "0.1"
serde_yaml = "0.9"
toml = "0.9"
unicode_categories = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[dev-dependencies]
assert_cmd = "2.1.2"
predicates = "3.1.3"
tempfile = "3.24.0"
